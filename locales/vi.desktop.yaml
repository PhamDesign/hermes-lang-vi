# Vietnamese language pack for Hermes Desktop
# Vietnamese translation by openai.vn
# Góp ý bản dịch: hello@openai.vn
#
# Installation: copy this file to $HERMES_HOME/locales/vi.desktop.yaml
#   (Linux: ~/.hermes/locales/vi.desktop.yaml)
#   then restart Hermes and select "Tiếng Việt" in Settings > Language.
# The gateway serves this overlay merged over the bundled catalog —
# no build patching needed, survives Hermes updates.
