freeTier.providerRowPitch: Đăng nhập bằng tài khoản Nous để mở khóa thêm model và tool.
freeTier.providerRowTitle: Nous · free tier
freeTier.readyCaption: Miễn phí · kèm connector
freeTier.readyTitle: Hermes đã sẵn sàng.
freeTier.rejectedBody: Không sao, bạn vẫn đang dùng service Nous miễn phí. Đăng nhập bất cứ khi nào sẵn sàng.
freeTier.retiredBody: Session của bạn đã kết thúc trước khi đăng nhập xong. Hermes sẽ bắt đầu session mới; rồi đăng nhập lại khi bạn sẵn sàng.
freeTier.settingUp: Đang thiết lập inference miễn phí…
freeTier.setupFailed.gateClosed: Phiên bản Hermes này không khởi động được nếu thiếu tài khoản Nous. Đăng nhập hoặc tạo tài khoản — miễn phí, chỉ mất một phút.
freeTier.setupFailed.generic: Hermes không thiết lập được quyền truy cập miễn phí nếu chưa đăng nhập. Đăng nhập miễn phí, hoặc kết nối provider khác.
freeTier.setupFailed.locked: Session này không tiếp tục được nếu chưa đăng nhập. Đăng nhập hoặc tạo tài khoản Nous miễn phí để tiếp tục.
freeTier.setupFailed.paused: Dùng Hermes không cần đăng nhập đang tạm dừng. Hermes sẽ tiếp tục kiểm tra. Đăng nhập miễn phí để dùng được ngay.
freeTier.setupFailed.powRequired: Máy chủ Nous yêu cầu proof of work, nhưng Agent của bạn chưa hỗ trợ. Đăng nhập hoặc tạo tài khoản Nous miễn phí để tiếp tục.
freeTier.setupFailed.rateLimited: Nhiều người đang bắt đầu cùng lúc nên Hermes sẽ thử lại sau {0}. Đăng nhập miễn phí để bỏ qua chờ đợi.
freeTier.setupFailed.retrying: Đang thử lại…
freeTier.setupFailed.serverError: Service Nous gặp sự cố nhỏ. Chạm Thử lại sau một lúc, hoặc kết nối provider khác tạm thời.
freeTier.setupFailed.signInBelow: Đăng nhập miễn phí. Chọn Nous bên dưới.
freeTier.setupFailed.tryAgain: Thử lại
freeTier.setupFailed.unreachable: Hermes không tới được service Nous. Kiểm tra kết nối mạng rồi chạm Thử lại. Hoặc kết nối provider khác tạm thời.
freeTier.signIn: Đăng nhập
