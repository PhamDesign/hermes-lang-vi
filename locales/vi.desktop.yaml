sendDiagnostics.privacyNotice: Thao tác này tải gói debug lên bộ nhớ nội bộ của Nous (không phải paste công khai). Nó gồm thông tin hệ thống (OS, phiên bản, provider, API key nào đã cấu hình — không bao giờ gồm chính key) và đầy đủ log agent, gateway, desktop (tối đa 512 KB mỗi loại), có thể chứa nội dung trò chuyện, output của tool và đường dẫn file. Secret được che trước khi tải lên. Gói chỉ Nous staff và Discord moderator được phép mới xem được, và tự xóa sau 14 ngày.
