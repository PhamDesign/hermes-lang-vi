updates.applyingBody: Trình cập nhật Hermes sẽ tiếp quản trong cửa sổ riêng và tự mở lại Hermes khi xong. Đừng tự mở lại Hermes trong lúc cập nhật.
updates.applyingBodyAppInstaller: Hermes sẽ đóng lại và Windows sẽ hoàn tất cập nhật. Hermes sẽ tự mở lại khi xong — bạn không cần làm gì.
updates.applyingBodyBackend: Backend từ xa đang áp dụng cập nhật và sẽ khởi động lại. Hermes tự kết nối lại khi nó quay lại.
