handoffTour.localText: '{0} vừa với phần cứng của bạn. Chạy miễn phí, và chat không bao giờ rời khỏi máy tính. Chọn nó ở đây, trong menu model, bất cứ khi nào bạn muốn.'
handoffTour.localTitle: Máy này có thể chạy model cục bộ
handoffTour.profileText: Thanh này chuyển profile. Profile đang sáng là default, nơi session tác vụ nằm. Profile còn lại là setup profile, nơi chat chào mừng nằm.
handoffTour.profileTitle: Tác vụ đầu tiên của bạn chạy trên default profile
handoffTour.sessionsText: Danh sách này thuộc về default profile. Session mới bắt đầu trên profile nào đang được chọn. Chuyển profile trên thanh và danh sách sẽ đổi theo.
handoffTour.sessionsTitle: Mỗi profile giữ session riêng
handoffTour.stayText: Chuyển sang setup profile và mở Welcome to Hermes bất cứ khi nào bạn cần giúp. Nó luôn ở đó.
handoffTour.stayTitle: Hermes chỉ cách một cú bấm
