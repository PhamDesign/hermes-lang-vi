fieldDescriptions.agent.imageInputMode: Điều khiển cách ảnh đính kèm được gửi tới model.
fieldDescriptions.agent.maxTurns: Giới hạn trên số turn gọi công cụ trước khi Hermes dừng một lần chạy.
fieldDescriptions.approvals.mode: Cách Hermes xử lý các command cần phê duyệt rõ ràng.
fieldDescriptions.approvals.timeout: Thời gian lời nhắc phê duyệt chờ trước khi hết hạn.
fieldDescriptions.auxiliary.compression.timeout: Số giây chờ model nén phụ trợ mỗi lần gọi (mặc định 120). Tăng lên cho các model local chậm.
fieldDescriptions.browser.useRealProfile: Duyệt local dùng thông tin đăng nhập thật của bạn. Hermes sao chép profile trình duyệt mặc định của bạn (cookie, thông tin đăng nhập, tùy chọn) vào một bản snapshot được quản lý và điều khiển nó bằng Chromium đi kèm — profile thật của bạn không bao giờ bị mở trực tiếp, và bản sao được làm mới từ nó mỗi lần chạy. Ngoài ra cho phép agent mở session local dùng profile thật theo yêu cầu ngay cả khi đã cấu hình backend trình duyệt đám mây. Chỉ hỗ trợ trình duyệt Chromium (Chrome, Edge, Brave, Brave Origin, Chromium); trình duyệt mặc định không phải Chromium sẽ báo lỗi rõ ràng. Tắt theo mặc định.
fieldDescriptions.checkpoints.enabled: Tạo snapshot khôi phục trước khi sửa tệp.
fieldDescriptions.codeExecution.mode: Mức độ giới hạn phạm vi thực thi code trong dự án hiện tại.
fieldDescriptions.compression.codexGpt55Autoraise: Tăng mức nén lên 85% cho các model ChatGPT Codex OAuth được hỗ trợ.
fieldDescriptions.compression.enabled: Tóm tắt context cũ khi cuộc trò chuyện quá lớn.
fieldDescriptions.context.engine: Chiến lược quản lý các cuộc trò chuyện dài gần giới hạn context.
fieldDescriptions.desktop.repoScanEnabled: Quét các thư mục local để tìm kho Git và hiển thị trong Projects.
fieldDescriptions.desktop.repoScanExcludePaths: Các thư mục (và thư mục con) bỏ qua khi phát hiện kho lưu trữ.
fieldDescriptions.desktop.repoScanRoots: Các thư mục cần quét. Để trống để quét thư mục home của bạn.
fieldDescriptions.display.personality: Phong cách mặc định của trợ lý cho các session mới.
fieldDescriptions.display.showReasoning: Hiện các phần suy luận khi backend cung cấp.
fieldDescriptions.fallbackProviders: Các mục provider:model dự phòng để thử khi model mặc định lỗi.
fieldDescriptions.fileReadMaxChars: Số ký tự tối đa Hermes có thể đọc trong một yêu cầu đọc tệp.
fieldDescriptions.memory.memoryEnabled: Lưu các bộ nhớ bền vững giúp ích cho các session sau.
fieldDescriptions.memory.userProfileEnabled: Duy trì hồ sơ gọn nhẹ về sở thích của người dùng.
fieldDescriptions.model: Dùng cho các chat mới trừ khi bạn chọn model khác trong composer.
fieldDescriptions.modelContextLength: Ghi đè cửa sổ context được phát hiện của model chat CHÍNH (token). Để 0 để dùng giá trị phát hiện của model đã chọn. Không ảnh hưởng các model phụ trợ/MoA.
fieldDescriptions.security.redactSecrets: Ẩn các secret bị phát hiện khỏi nội dung mà model nhìn thấy khi có thể.
fieldDescriptions.stt.echoTranscripts: Đăng lại bản ghi 🎙️ thô của tin nhắn thoại vào chat.
fieldDescriptions.stt.elevenlabs.languageCode: Mã ngôn ngữ ISO-639-3 tùy chọn. Để trống để ElevenLabs tự phát hiện.
fieldDescriptions.stt.enabled: Bật phiên âm giọng nói local hoặc qua nhà cung cấp.
fieldDescriptions.stt.streaming: Hiện chữ khi bạn nói (OpenAI, xAI, ElevenLabs). Tự chuyển sang bản ghi âm khi có lỗi.
fieldDescriptions.terminal.cwd: Thư mục dự án mặc định cho công cụ và terminal.
fieldDescriptions.terminal.daytonaImage: Image dùng khi backend thực thi là Daytona.
fieldDescriptions.terminal.dockerImage: Container image dùng khi backend thực thi là Docker.
fieldDescriptions.terminal.envPassthrough: Các biến môi trường truyền vào khi thực thi công cụ.
fieldDescriptions.terminal.modalImage: Image dùng khi backend thực thi là Modal.
fieldDescriptions.terminal.persistentShell: 'Backend SSH: giữ các biến đã export giữa các command. Tắt thì mỗi command bắt đầu từ môi trường đăng nhập; thư mục làm việc luôn được giữ lại.'
fieldDescriptions.terminal.singularityImage: Image dùng khi backend thực thi là Singularity.
fieldDescriptions.timezone: Mã múi giờ IANA. Để trống để dùng múi giờ hệ thống.
fieldDescriptions.tts.neutts.device: Thiết bị suy luận local cho NeuTTS.
fieldDescriptions.tts.xai.autoSpeechTags: Để LLM chèn các thẻ âm thanh biểu cảm ([laughing], [sighs]) vào kịch bản trước khi tổng hợp.
fieldDescriptions.tts.xai.bitRate: Tốc độ bit MP3 tính bằng bps. Chỉ áp dụng khi codec là mp3.
fieldDescriptions.tts.xai.language: Mã ngôn ngữ nói (ví dụ en, pt-BR) hoặc "auto" để tự phát hiện.
fieldDescriptions.tts.xai.optimizeStreamingLatency: Đánh đổi độ trễ và chất lượng. 0 = chất lượng tốt nhất, 2 = độ trễ thấp nhất.
fieldDescriptions.tts.xai.sampleRate: Tần số lấy mẫu âm thanh tính bằng Hz. Cao hơn = chất lượng tốt hơn, tệp lớn hơn.
fieldDescriptions.tts.xai.speed: Tốc độ phát. 0.7 = chậm hơn, 1.0 = bình thường, 1.5 = nhanh hơn.
fieldDescriptions.tts.xai.voiceId: ID giọng xAI (ví dụ eve) hoặc ID giọng tùy chỉnh.
fieldDescriptions.updates.nonInteractiveLocalChanges: Khi Hermes tự cập nhật từ app (không hỏi qua terminal), giữ các chỉnh sửa source local (stash) hay bỏ đi (discard). Cập nhật qua terminal luôn hỏi.
fieldDescriptions.voice.autoTts: Tự động đọc to phản hồi của trợ lý.
fieldDescriptions.voice.gptLive.instructions: Các câu bổ sung cho nhân cách giọng trực tiếp (giọng điệu, nhịp độ, ngôn ngữ). Hermes giữ system prompt của riêng mình.
fieldDescriptions.voice.gptLive.voice: Giọng cho chế độ GPT-Live. Chấp nhận ID giọng tùy chỉnh.
fieldDescriptions.voice.voiceChatMode: 'chained: chuyển giọng nói thành văn bản → Hermes → chuyển văn bản thành giọng nói với các nhà cung cấp bên dưới. gpt-live: một model thoại full-duplex của OpenAI (gpt-live-1) lắng nghe và nói, và chuyển mọi yêu cầu thực cho Hermes — bất kỳ model nào bạn đã chọn đều trả lời với đầy đủ bộ công cụ. Cần OpenAI API key; lớp thoại tính phí $0.05 mỗi phút.'
