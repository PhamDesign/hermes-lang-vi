settings.fieldDescriptions.agent.imageInputMode: Điều khiển cách gửi đính kèm hình ảnh cho model.
settings.fieldDescriptions.agent.maxTurns: Giới hạn trên số lượt gọi tool trước khi Hermes dừng một lần chạy.
settings.fieldDescriptions.approvals.mode: Cách Hermes xử lý các lệnh cần phê duyệt rõ ràng.
settings.fieldDescriptions.approvals.timeout: Thời gian chờ của lời nhắc phê duyệt trước khi hết hạn.
settings.fieldDescriptions.auxiliary.compression.timeout: Số giây chờ model nén phụ cho mỗi lần gọi (mặc định 120). Tăng lên với model cục bộ chậm.
settings.fieldDescriptions.browser.useRealProfile: Duyệt web cục bộ dùng thông tin đăng nhập thật. Hermes sao chép profile của browser mặc định (cookie, thông tin đăng nhập, tùy chọn) vào snapshot được quản lý và điều khiển bằng Chromium đóng gói — profile thật không bao giờ bị mở trực tiếp, và bản sao được làm mới từ profile gốc mỗi lần chạy. Cũng cho phép agent mở session profile thật cục bộ theo yêu cầu ngay cả khi đã cấu hình backend browser đám mây. Chỉ hỗ trợ browser Chromium (Chrome, Edge, Brave, Brave Origin, Chromium); browser mặc định không phải Chromium sẽ báo lỗi rõ ràng. Mặc định tắt.
settings.fieldDescriptions.checkpoints.enabled: Tạo snapshot rollback trước khi sửa file.
settings.fieldDescriptions.codeExecution.mode: Mức độ giới hạn thực thi code trong dự án hiện tại.
settings.fieldDescriptions.compression.codexGpt55Autoraise: Tăng mức nén lên 85% cho các model ChatGPT Codex OAuth được hỗ trợ.
settings.fieldDescriptions.compression.enabled: Tóm tắt ngữ cảnh cũ khi hội thoại trở nên dài.
settings.fieldDescriptions.context.engine: Chiến lược quản lý hội thoại dài khi gần giới hạn ngữ cảnh.
settings.fieldDescriptions.desktop.repoScanEnabled: Quét thư mục cục bộ tìm repository Git để hiển thị trong Projects.
settings.fieldDescriptions.desktop.repoScanExcludePaths: Thư mục và các thư mục con sẽ bỏ qua khi phát hiện repository.
settings.fieldDescriptions.desktop.repoScanRoots: Thư mục để quét. Để trống để quét thư mục home.
settings.fieldDescriptions.display.personality: Kiểu trợ lý mặc định cho session mới.
settings.fieldDescriptions.display.showReasoning: Hiển thị các phần reasoning khi backend cung cấp.
settings.fieldDescriptions.fallbackProviders: Các mục provider:model dự phòng để thử khi model mặc định lỗi.
settings.fieldDescriptions.fileReadMaxChars: Số ký tự tối đa Hermes có thể đọc từ một yêu cầu file.
settings.fieldDescriptions.memory.memoryEnabled: Lưu bộ nhớ bền vững có thể giúp các session sau.
settings.fieldDescriptions.memory.userProfileEnabled: Duy trì profile gọn nhẹ về tùy chọn người dùng.
settings.fieldDescriptions.model: Dùng cho chat mới, trừ khi chọn model khác trong khung soạn thảo.
settings.fieldDescriptions.modelContextLength: Ghi đè cửa sổ ngữ cảnh đã phát hiện, chỉ cho model chat CHÍNH (token). Để 0 để dùng giá trị đã phát hiện của model đã chọn. Không ảnh hưởng model phụ/MoA.
settings.fieldDescriptions.security.redactSecrets: Ẩn các secret đã phát hiện khỏi nội dung mà model thấy được, khi có thể.
settings.fieldDescriptions.stt.echoTranscripts: Đăng bản chép 🎙️ thô của tin nhắn thoại trở lại chat.
settings.fieldDescriptions.stt.elevenlabs.languageCode: Mã ngôn ngữ ISO-639-3 tùy chọn. Để trống để ElevenLabs tự nhận diện.
settings.fieldDescriptions.stt.enabled: Bật chép lời giọng nói cục bộ hoặc qua nhà cung cấp.
settings.fieldDescriptions.stt.streaming: Hiển thị text khi nói (OpenAI, xAI, ElevenLabs). Khi lỗi sẽ dùng bản ghi âm.
settings.fieldDescriptions.terminal.cwd: Thư mục dự án mặc định cho tool và công việc terminal.
settings.fieldDescriptions.terminal.daytonaImage: Image dùng khi backend thực thi là Daytona.
settings.fieldDescriptions.terminal.dockerImage: Container image dùng khi backend thực thi là Docker.
settings.fieldDescriptions.terminal.envPassthrough: Biến môi trường truyền vào quá trình thực thi tool.
settings.fieldDescriptions.terminal.modalImage: Image dùng khi backend thực thi là Modal.
settings.fieldDescriptions.terminal.persistentShell: 'Backend SSH: giữ các biến đã export giữa các lệnh. Khi tắt, mỗi lệnh bắt đầu từ môi trường login; thư mục làm việc luôn được giữ.'
settings.fieldDescriptions.terminal.singularityImage: Image dùng khi backend thực thi là Singularity.
settings.fieldDescriptions.timezone: Mã định danh múi giờ IANA. Để trống dùng múi giờ hệ thống.
settings.fieldDescriptions.tts.neutts.device: Thiết bị inference cục bộ cho NeuTTS.
settings.fieldDescriptions.tts.xai.autoSpeechTags: Để LLM chèn thẻ âm thanh biểu cảm ([laughing], [sighs]) vào kịch bản trước khi tổng hợp.
settings.fieldDescriptions.tts.xai.bitRate: Bitrate MP3 tính bằng bps. Chỉ áp dụng khi codec là mp3.
settings.fieldDescriptions.tts.xai.language: Mã ngôn ngữ nói (VD en, pt-BR) hoặc "auto" để tự nhận diện.
settings.fieldDescriptions.tts.xai.optimizeStreamingLatency: Đánh đổi giữa độ trễ và chất lượng. 0 = chất lượng tốt nhất, 2 = độ trễ thấp nhất.
settings.fieldDescriptions.tts.xai.sampleRate: Tần số lấy mẫu âm thanh tính bằng Hz. Cao hơn = chất lượng tốt hơn, file lớn hơn.
settings.fieldDescriptions.tts.xai.speed: Tốc độ phát. 0.7 = chậm hơn, 1.0 = bình thường, 1.5 = nhanh hơn.
settings.fieldDescriptions.tts.xai.voiceId: Voice ID xAI (VD eve) hoặc voice ID tùy chỉnh.
settings.fieldDescriptions.updates.nonInteractiveLocalChanges: Khi Hermes tự cập nhật từ app (không hỏi qua terminal), giữ lại chỉnh sửa nguồn cục bộ (stash) hoặc bỏ đi (discard). Cập nhật qua terminal luôn hỏi.
settings.fieldDescriptions.voice.autoTts: Tự động đọc to câu trả lời của trợ lý.
settings.fieldDescriptions.voice.gptLive.instructions: Các câu bổ sung cho persona giọng trực tiếp (giọng điệu, nhịp độ, ngôn ngữ). Hermes giữ system prompt riêng.
settings.fieldDescriptions.voice.gptLive.voice: Giọng cho chế độ GPT-Live. Chấp nhận voice ID tùy chỉnh.
settings.fieldDescriptions.voice.voiceChatMode: 'chained: speech-to-text → Hermes → text-to-speech với các nhà cung cấp bên dưới. gpt-live: một model giọng nói song công toàn phần của OpenAI (gpt-live-1) nghe và nói, rồi chuyển mọi yêu cầu thực cho Hermes — bất kỳ model nào đã chọn đều trả lời với đầy đủ toolset. Cần OpenAI API key; lớp giọng nói tính phí $0.05 mỗi phút.'
